{% extends "base.html" %}

{% block content %}

<h1>Create League</h1>

<form method="POST">

    <p>
        League Name
        <br>
        <input
            type="text"
            name="name"
            required
        >
    </p>

    <p>
        Season
        <br>

        <select
            name="season_id"
            required
        >

            {% for season in seasons %}

                <option value="{{ season.id }}">

                    {{ season.sport }}
                    {{ season.year }}
                    ({{ season.status }})

                </option>

            {% endfor %}

        </select>

    </p>

    <p>

        Pick Mode

        <br>

        <select
            name="pick_mode"
            required
        >

            {% for mode in pick_modes %}

                <option value="{{ mode }}">
                    {{ mode }}
                </option>

            {% endfor %}

        </select>

    </p>

    <p>

        Visibility

        <br>

        <select
            name="visibility"
            required
        >

            {% for visibility in visibility_options %}

                <option value="{{ visibility }}">
                    {{ visibility }}
                </option>

            {% endfor %}

        </select>

    </p>

    <p>

        <label>

            <input
                type="checkbox"
                name="include_playoffs"
                checked
            >

            Include Playoffs

        </label>

    </p>

    <button type="submit">

        Create League

    </button>

</form>

{% endblock %}
